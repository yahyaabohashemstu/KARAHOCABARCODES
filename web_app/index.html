<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KARAHOCA Barcode Pro</title>
    <link rel="stylesheet" href="style.css">
    <!-- مكتبات ZIP (توليد وتنزيل المجموعة) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
</head>

<body>

    <div class="main-container">
        <header>
            <h1>KARAHOCA BARCODE PRO</h1>
            <div class="tabs" role="tablist">
                <button id="tab-generator" class="tab-btn active" role="tab" aria-selected="true" aria-controls="generator-tab" onclick="switchTab('generator')">📠 مولد الباركود</button>
                <button id="tab-history" class="tab-btn" role="tab" aria-selected="false" aria-controls="history-tab" onclick="switchTab('history')">📜 سجل العمليات</button>
                <button id="tab-verify" class="tab-btn" role="tab" aria-selected="false" aria-controls="verify-tab" onclick="switchTab('verify')">🔎 تحقق عكسي</button>
            </div>
        </header>

        <!-- تبويب المولد -->
        <div id="generator-tab" class="tab-content active" role="tabpanel" aria-labelledby="tab-generator">
            <div class="input-row">
                <div class="input-group main-input">
                    <label for="inputCode">أدخل رقم المنتج (12 خانة):</label>
                    <input type="text" id="inputCode" placeholder="مثال: 869924369411" maxlength="12">
                </div>
                <div class="input-group count-input">
                    <label for="batchCount">العدد:</label>
                    <input type="number" id="batchCount" value="1" min="1" max="100">
                </div>
            </div>

            <div class="actions">
                <button class="btn secondary" onclick="clearFields()">مسح الحقول</button>
                <button class="btn info" onclick="incrementCode()">(+1)</button>
                <button class="btn primary" onclick="calculate()">حساب وتسجيل</button>
            </div>

            <div class="result-box">
                <div class="result-row">
                    <span id="checkDigitLabel">رقم التحقق:</span>
                    <span id="checkDigit" class="highlight" role="status" aria-live="polite" aria-labelledby="checkDigitLabel checkDigit">-</span>
                </div>
                <div class="result-row">
                    <span id="fullBarcodeLabel">الباركود الكامل:</span>
                    <input type="text" id="fullBarcode" readonly aria-labelledby="fullBarcodeLabel">
                </div>
            </div>

            <div class="btn-group-vertical">
                <button id="btnExport" class="btn success full-width" onclick="exportSVG()" disabled>💾 حفظ صورة الباركود (SVG)</button>
                <button id="btnBatch" class="btn warning full-width" onclick="generateBatch()">📦 توليد وتنزيل المجموعة (ZIP)</button>
            </div>

            <div class="recent-bar">
                <span>آخر الأرقام المستخدمة:</span>
                <span id="recentDisplay">...</span>
            </div>
        </div>

        <!-- تبويب السجل -->
        <div id="history-tab" class="tab-content" role="tabpanel" aria-labelledby="tab-history">
            <div class="toolbar">
                <button class="btn secondary" onclick="loadHistory()">🔄 تحديث السجل</button>
                <button class="btn warning" onclick="deleteSelected()">🗑️ حذف المحدد</button>
                <button class="btn danger" onclick="clearHistory()">❌ حذف الكل</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th><input type="checkbox" id="selectAll" onclick="toggleSelectAll()" aria-label="تحديد الكل"></th>
                        <th>التوقيت</th>
                        <th>المدخل</th>
                        <th>التحقق</th>
                        <th>الكامل</th>
                    </tr>
                </thead>
                <tbody id="historyTableBody">
                    <!-- البيانات هنا -->
                </tbody>
            </table>
        </div>

        <!-- تبويب التحقق العكسي -->
        <div id="verify-tab" class="tab-content" role="tabpanel" aria-labelledby="tab-verify">
            <div class="input-group">
                <label for="verifyInput">الصق باركود كامل (13 خانة):</label>
                <input type="text" id="verifyInput" placeholder="مثال: 8699243694118" maxlength="13">
            </div>
            <button class="btn primary full-width" onclick="verifyCode()">تحقق وفكّ الترميز</button>
            <div id="verifyResult" class="result-box" style="display:none;"></div>
            <div id="verifyBarcode"></div>
        </div>

        <footer>
            Developed for KARAHOCA TEMİZLİK
        </footer>
    </div>

    <script src="script.js"></script>
</body>

</html>
